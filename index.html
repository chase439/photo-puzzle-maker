<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Photo Puzzle Maker</title>
<link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo" title="Photo Puzzle Maker">🧩<span class="logo-text"> Photo Puzzle Maker</span></h1>

    <div class="controls">
      <label class="btn btn-photo">
        📷 <span class="label-full">Choose photo</span><span class="label-short">Photo</span>
        <input type="file" id="fileInput" accept="image/*" hidden />
      </label>
      <button type="button" class="btn btn-ghost" id="sampleBtn">🌈 <span class="label-full">Sample picture</span><span class="label-short">Sample</span></button>

      <div class="count-group" role="group" aria-label="Number of pieces">
        <span class="count-label">Pieces:</span>
        <button type="button" class="chip" data-count="25">25</button>
        <button type="button" class="chip is-active" data-count="50">50</button>
        <button type="button" class="chip" data-count="75">75</button>
        <button type="button" class="chip" data-count="100">100</button>
      </div>

      <button type="button" class="btn btn-go" id="startBtn" disabled>▶ <span class="label-full">Make puzzle</span><span class="label-short">Make</span></button>
      <button type="button" class="btn btn-ghost" id="shuffleBtn" disabled>🔀 Shuffle</button>
      <button type="button" class="btn btn-ghost" id="peekBtn" disabled aria-pressed="false">👀 Peek</button>
    </div>

    <div class="status"><span id="statusText">Pick a photo to start!</span></div>
  </header>

  <main id="stageWrap">
    <div id="stage">
      <div id="board"><canvas id="ghost"></canvas></div>
      <div id="piecesLayer"></div>
    </div>

    <div id="dropHint" class="drop-hint">
      <div class="drop-hint-inner">
        <div class="drop-emoji">🖼️</div>
        <p><strong>Drop a photo here</strong></p>
        <p class="muted">or use 📷 or 🌈 above</p>
        <p class="muted how-to">Drag a piece to move it • Tap a piece to turn it • Pieces click into place when they fit</p>
      </div>
    </div>

    <div id="dropOverlay" class="drop-overlay"><span>Drop the photo! 🎉</span></div>
  </main>

  <div id="winOverlay" class="win-overlay" hidden>
    <canvas id="confetti"></canvas>
    <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <button type="button" class="win-close" id="winCloseBtn" aria-label="Close and look at the puzzle">✕</button>
      <div class="win-emoji">🏆</div>
      <h2 id="winTitle">You did it!</h2>
      <p id="winText">Puzzle finished!</p>
      <div class="win-actions">
        <button type="button" class="btn btn-ghost" id="viewBtn">🖼️ See my puzzle</button>
        <button type="button" class="btn btn-go" id="againBtn">🔁 Play again</button>
        <button type="button" class="btn btn-ghost" id="newPhotoBtn">📷 New photo</button>
      </div>
    </div>
  </div>

  <script src="jigsaw.js?v=2"></script>
  <script src="pieces.js?v=2"></script>
  <script src="effects.js?v=2"></script>
  <script src="interaction.js?v=2"></script>
  <script src="sample.js?v=2"></script>
  <script src="main.js?v=2"></script>
</body>
</html>
